name: 보드 갱신

on:
  workflow_dispatch:          # 폰에서 누르는 "Run workflow" 버튼
  push:                       # 코드를 고치면 자동 재실행
    branches: [main]
    paths:                    # docs/ 는 제외 — 워크플로 자신의 커밋으로 무한루프 방지
      - "board.py"
      - ".github/workflows/update.yml"
  schedule:
    # UTC 기준. 아래는 한국시간 07~24시대 30분 간격(평일).
    # 주의: GitHub cron은 최소 5분 간격이며 실제로는 수 분씩 밀린다. 정시 보장 없음.
    - cron: "0,30 22-23,0-15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: board
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet yfinance

      - name: 버전 지문 확인
        run: |
          echo "STALE_LIMIT 존재 여부:"; grep -c "STALE_LIMIT" board.py || echo "0 (구버전!)"
          echo "밀 배율 존재 여부:";     grep -c "mult=0.01"  board.py || echo "0 (구버전!)"

      - name: 수집 및 렌더
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}   # 없으면 한국 국채금리만 '수집실패'로 표기됨
          TZ: Asia/Seoul
        run: python board.py --out docs

      - name: 결과 커밋
        run: |
          git config user.name  "market-board"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M KST')"
          git push
